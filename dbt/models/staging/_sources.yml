version: 2

sources:
  - name: bronze
    description: Raw layer written by the Python ingest pipeline (append-only).
    tables:
      - name: raw_observations
        description: Validated price observations, one per listing per check window.
        columns:
          - name: observation_key
            data_tests: [unique, not_null]
          - name: listing_id
            data_tests: [not_null]
          - name: price
            data_tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
      - name: rejected_observations
        description: Observations refused by the validator ($0, 100x spikes, ...).
        columns:
          - name: reason
            data_tests:
              - accepted_values:
                  arguments:
                    values: [missing_price, non_positive_price, price_outlier, absurd_price, bad_currency]
      - name: ingest_runs
        columns:
          - name: run_id
            data_tests: [unique, not_null]

  - name: app
    description: Operational tables (watchlist and listing registry).
    tables:
      - name: items
        columns:
          - name: item_id
            data_tests: [unique, not_null]
      - name: listings
        columns:
          - name: listing_id
            data_tests: [unique, not_null]
      - name: item_listings
