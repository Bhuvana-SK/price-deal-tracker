version: 2

models:
  - name: fct_price_daily
    description: Daily min/max/close price per item x listing.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_id, listing_id, price_date]
    columns:
      - name: close_price
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: n_observations
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: fct_listing_daily_signals
    description: >
      Backward-looking deal signals for every listing-day (30/90-day averages,
      90-day and all-time lows, inflation check, deal flag). Each row uses only
      earlier days, so it is safe to backtest on.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_id, listing_id, price_date]
    columns:
      - name: deal_flag
        data_tests: [not_null]
      - name: deal_reason
        data_tests: [not_null]
      - name: pct_vs_avg_30d
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 10
      - name: all_time_low
        data_tests: [not_null]

  - name: mart_listing_current
    description: Latest price and deal signals per item x listing (the dashboard's main table).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_id, listing_id]
    columns:
      - name: current_price
        data_tests: [not_null]
      - name: pct_drop_24h
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -10
                max_value: 1
      - name: is_below_target
        data_tests: [not_null]

  - name: mart_store_comparison
    description: Current in-stock listings per item ranked by total cost (price + shipping).
    columns:
      - name: cost_rank
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: extra_vs_cheapest
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: mart_item_price_daily
    description: Best in-stock total cost per item per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_id, price_date, currency]

  - name: mart_weekly_movers
    description: Weekly start/end/low/high of each item's best price (digest input).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [item_id, currency, week_start]

  - name: mart_data_quality_daily
    description: Loaded vs. rejected rows per source per day.
    columns:
      - name: reject_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
