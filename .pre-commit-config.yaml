repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: env UV_PROJECT_ENVIRONMENT=venv uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: env UV_PROJECT_ENVIRONMENT=venv uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: env UV_PROJECT_ENVIRONMENT=venv uv run mypy
        language: system
        types: [python]
        pass_filenames: false
